            <h2>Contact Us</h2>
            
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" placeholder="Enter your first name">

            <label for="email">Email Address <span class="required">*</span></label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <label for="phoneNumber">Phone Number</label>
            <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="Enter your phone number">

          <label for="testingDropdown">Testing dropdown field:</label>
          <div id="dropdown" class="dropdown">
          <button class="dropdown-btn">Select an option</button>
          <div class="dropdown-content">
          <span data-name="Test 1">Test 1</span>
          <span data-name="Test 2">Test 2</span>
          </div>
          <input type="hidden" id="selectedValue" name="testingDropdown">
</div>
	    
            <button type="button", data-bind="click: submitForm, addIsProcessingClass: isProcessing, disabled: isProcessing">Subscribe</button>

        <p id="thankYouMessage" style="display: none;">Thanks for submitting the form!</p>
